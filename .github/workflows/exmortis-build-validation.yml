name: Exmortis frontend build validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      EXM_FALLBACK_OFFLINE: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Print compiler versions
        run: |
          node --version
          node node_modules/vite/bin/vite.js --version
      - name: Build via Vite entrypoint, no npm wrapper
        run: node node_modules/vite/bin/vite.js build
      - name: Check frontend artifact
        run: |
          test -s dist/index.html
          echo "Built assets: $(find dist -type f | wc -l)"
